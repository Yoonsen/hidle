<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Høringer PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1>Høringer</h1>
    <p>Les dokumenter direkte fra <code>høringer/</code>.</p>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <label for="corpusSelect">Korpus</label>
      <select id="corpusSelect">
        <option value="alle">Alle korpus</option>
        <option value="foer-2022">Før 2022</option>
        <option value="fra-2022">Fra 2022</option>
        <option value="uten-aar">Uten år</option>
      </select>
      <label for="filterInput">Filtrer dokumenter</label>
      <input id="filterInput" type="search" placeholder="Søk i filnavn/avsender/år">
      <p id="stats" class="muted">Laster...</p>
      <ul id="docList" class="doc-list"></ul>
    </aside>

    <section class="reader">
      <div id="docMeta" class="meta muted">Velg et dokument fra listen.</div>
      <section id="concordancePanel" class="concordance">
        <div class="concordance-head">
          <h2>Konkordans</h2>
          <button id="concordanceToggle" type="button" class="concordance-toggle">Skjul</button>
        </div>
        <div id="concordanceBody" class="concordance-body">
          <div class="concordance-controls">
            <input id="concordanceQuery" type="search" placeholder="Søk i innhold, f.eks. grunnrente">
            <input id="concordanceContext" type="number" min="20" max="300" value="90" title="Kontekst i tegn">
            <input id="concordanceMaxHits" type="number" min="1" max="20" value="5" title="Maks treff per dokument">
            <button id="concordanceButton" type="button">Søk</button>
          </div>
          <p id="concordanceStatus" class="muted">Søk i innholdet i dokumentene.</p>
          <div id="concordanceResults" class="concordance-results"></div>
        </div>
      </section>
      <pre id="docContent" class="doc-content"></pre>
    </section>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
